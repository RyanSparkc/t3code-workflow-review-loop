<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Workflow Diagram</title>
<!--
  Source for .github/workflow-{light,dark}-{en,zh}.png.
  Render each variant with a headless browser at 1080x440, device scale factor 2
  and a transparent background, for example:
    msedge --headless=new --hide-scrollbars --force-device-scale-factor=2
      --default-background-color=00000000 --window-size=1080,440
      --screenshot=workflow-dark-en.png "file:///.../workflow-diagram.html?theme=dark&lang=en"
  Query: theme=light|dark, lang=en|zh. Edit the text table at the bottom.
-->
<style>
  :root {
    --text: #1f2328; --muted: #59636e; --line: #8c959f; --panel: #f6f8fa;
    --task: #59636e; --build: #bc4c00; --verify: #1a7f37; --review: #0969da;
    --you: #8250df; --stop: #cf222e;
  }
  html.dark {
    --text: #e6edf3; --muted: #9198a1; --line: #6e7681; --panel: #161b22;
    --task: #9198a1; --build: #f0883e; --verify: #7ee787; --review: #79c0ff;
    --you: #d2a8ff; --stop: #ff7b72;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1080px; height: 440px; overflow: hidden; background: transparent; }
  body { position: relative; color: var(--text); font-family: "Segoe UI", Arial, sans-serif; }
  html.zh body { font-family: "Microsoft JhengHei UI", "Microsoft JhengHei", "Segoe UI", sans-serif; }

  .box {
    position: absolute; display: flex; flex-direction: column; justify-content: center;
    background: var(--panel); border: 2px solid var(--c); border-radius: 12px; padding: 0 12px;
  }
  .box b { font-size: 19px; font-weight: 650; color: var(--c); line-height: 1.2; white-space: nowrap; }
  .box span { margin-top: 4px; font-size: 13px; color: var(--muted); line-height: 1.3; white-space: pre-line; }
  .task { --c: var(--task); } .build, .revise { --c: var(--build); } .verify { --c: var(--verify); }
  .review { --c: var(--review); } .you, .merge, .keep { --c: var(--you); } .stop { --c: var(--stop); }
  .stop, .revise { border-style: dashed; }

  svg { position: absolute; inset: 0; width: 1080px; height: 440px; overflow: visible; }
  .edge { fill: none; stroke: var(--line); stroke-width: 2; }
  .edge.back { stroke: var(--build); }
  .edge.halt { stroke: var(--stop); }
  .label { position: absolute; font-size: 13px; color: var(--muted); white-space: pre-line; line-height: 1.3; }
  .label.halt { color: var(--stop); }
  .label.back { color: var(--build); }
  .caption { position: absolute; right: 12px; bottom: 6px; font-size: 13px; color: var(--muted); font-family: Consolas, monospace; }
  html.zh .caption { font-family: inherit; }
</style>
</head>
<body>
<svg>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--line)"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--build)"/>
    </marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="var(--stop)"/>
    </marker>
  </defs>
  <!-- main row, boxes span y 193..277, centre y 235 -->
  <path class="edge" d="M122,235 H148" marker-end="url(#a)"/>
  <path class="edge" d="M290,235 H316" marker-end="url(#a)"/>
  <path class="edge" d="M458,235 H484" marker-end="url(#a)"/>
  <path class="edge" d="M626,235 H708" marker-end="url(#a)"/>
  <!-- decision fan-out to outcomes centred at y 185 and 285 -->
  <path class="edge" d="M850,235 H860 Q866,235 866,229 V191 Q866,185 872,185 H882" marker-end="url(#a)"/>
  <path class="edge" d="M850,235 H860 Q866,235 866,241 V279 Q866,285 872,285 H882" marker-end="url(#a)"/>
  <!-- loop through Revise -->
  <path class="edge back" d="M420,277 V348" marker-end="url(#ab)"/>
  <path class="edge back" d="M556,277 V348" marker-end="url(#ab)"/>
  <path class="edge back" d="M356,350 V279" marker-end="url(#ab)"/>
  <!-- checkout changed during review -->
  <path class="edge halt" d="M556,193 V104" marker-end="url(#ah)"/>
</svg>

<div class="box task"   style="left:12px;  top:193px; width:110px; height:84px;"><b data-t="task"></b><span data-t="taskSub"></span></div>
<div class="box build"  style="left:150px; top:193px; width:140px; height:84px;"><b data-t="build"></b><span data-t="buildSub"></span></div>
<div class="box verify" style="left:318px; top:193px; width:140px; height:84px;"><b data-t="verify"></b><span data-t="verifySub"></span></div>
<div class="box review" style="left:486px; top:193px; width:140px; height:84px;"><b data-t="review"></b><span data-t="reviewSub"></span></div>
<div class="box you"    style="left:710px; top:193px; width:140px; height:84px;"><b data-t="you"></b><span data-t="youSub"></span></div>
<div class="box merge"  style="left:884px; top:149px; width:184px; height:72px;"><b data-t="merge"></b><span data-t="mergeSub"></span></div>
<div class="box keep"   style="left:884px; top:249px; width:184px; height:72px;"><b data-t="keep"></b><span data-t="keepSub"></span></div>
<div class="box revise" style="left:340px; top:350px; width:264px; height:62px;"><b data-t="revise"></b><span data-t="reviseSub"></span></div>
<div class="box stop"   style="left:466px; top:36px;  width:180px; height:66px;"><b data-t="stop"></b><span data-t="stopSub"></span></div>

<div class="label"      style="left:626px; top:210px; width:82px; text-align:center;" data-t="approved"></div>
<div class="label back" style="left:426px; top:300px;" data-t="fail"></div>
<div class="label back" style="left:562px; top:300px;" data-t="changes"></div>
<div class="label back" style="left:290px; top:300px; width:60px; text-align:right;" data-t="fixed"></div>
<div class="label halt" style="left:564px; top:124px;" data-t="changed"></div>
<div class="caption" data-t="caption"></div>

<script>
  // "\n" marks an intended line break in a subtitle or label.
  const text = {
    en: {
      task: "Task", taskSub: "& acceptance\ncriteria",
      build: "Build", buildSub: "builder, in its\nown worktree",
      verify: "Verify", verifySub: "commits + tests,\nchecked in code",
      review: "Review", reviewSub: "1–2 models,\nread-only",
      you: "You decide", youSub: "after all\nreviews pass",
      merge: "Merge locally", mergeSub: "reviewed commit only",
      keep: "Keep the branch", keepSub: "nothing is merged",
      revise: "Revise", reviseSub: "back in the same builder thread",
      stop: "Stop the run", stopSub: "inspect the checkout",
      approved: "approved", fail: "fails", changes: "changes requested", fixed: "fixed",
      changed: "checkout changed\nduring review", caption: "never runs git push",
    },
    zh: {
      task: "任務", taskSub: "含驗收條件",
      build: "實作", buildSub: "builder 在\n獨立 worktree",
      verify: "驗證", verifySub: "commit 與測試\n由程式檢查",
      review: "審查", reviewSub: "1–2 個模型\n唯讀",
      you: "由你決定", youSub: "所有 reviewer\n核准後",
      merge: "本機合併", mergeSub: "只合併審過的 commit",
      keep: "保留分支", keepSub: "不合併",
      revise: "修正", reviseSub: "回到原本的 builder thread",
      stop: "停止 run", stopSub: "請檢查 checkout",
      approved: "核准", fail: "未通過", changes: "要求修正", fixed: "修好後",
      changed: "審查期間\ncheckout 被改動", caption: "整個流程不會執行 git push",
    },
  };
  const params = new URLSearchParams(location.search);
  const lang = params.get("lang") === "zh" ? "zh" : "en";
  document.documentElement.classList.toggle("dark", params.get("theme") === "dark");
  document.documentElement.classList.toggle("zh", lang === "zh");
  document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
  for (const el of document.querySelectorAll("[data-t]")) el.textContent = text[lang][el.dataset.t];
</script>
</body>
</html>
